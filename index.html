<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishMaster 3D Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
            --depth: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 2000px; /* Profundidad global */
        }

        /* --- FONDO 3D ANIMADO --- */
        .world-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            z-index: -2;
        }
        .grid-floor {
            position: fixed; bottom: -20%; left: -50%; width: 200%; height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { from { transform: rotateX(60deg) translateY(0); } to { transform: rotateX(60deg) translateY(50px); } }

        /* --- LANDING PAGE 3D --- */
        #landing-page {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; position: relative; z-index: 10; transition: all 1s ease;
        }
        
        .hero-title {
            font-family: 'Outfit', sans-serif; font-size: 6rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            transform: translateZ(50px);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .btn-3d {
            margin-top: 3rem; padding: 1.2rem 3rem; font-size: 1.2rem; font-weight: 700;
            color: white; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; border-radius: 12px; cursor: pointer;
            transform-style: preserve-3d; transform: translateZ(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4), 0 5px 0 #312e81;
        }
        .btn-3d:hover { transform: translateZ(30px) translateY(-5px); box-shadow: 0 25px 40px rgba(99, 102, 241, 0.6), 0 5px 0 #312e81; }
        .btn-3d:active { transform: translateZ(10px) translateY(2px); box-shadow: 0 5px 10px rgba(99, 102, 241, 0.4), 0 0 0 #312e81; }

        /* --- DASHBOARD 3D --- */
        #app-interface { display: none; opacity: 0; padding: 2rem; max-width: 1600px; margin: 0 auto; min-height: 100vh; }
        
        .dashboard-container {
            display: grid; grid-template-columns: 300px 1fr; gap: 3rem;
            transform-style: preserve-3d;
        }

        /* Sidebar Flotante */
        .sidebar {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 2rem; height: fit-content; position: sticky; top: 2rem;
            transform: translateZ(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .nav-item {
            padding: 1rem; margin-bottom: 1rem; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 1rem; color: var(--text-muted);
            transition: all 0.3s; border: 1px solid transparent;
            background: rgba(255,255,255,0.02);
        }
        .nav-item:hover { transform: translateX(10px) translateZ(10px); background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { 
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), transparent); 
            border-left: 4px solid var(--primary); color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .nav-item.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        /* Main Stage 3D Card */
        .main-stage {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 3rem; min-height: 80vh;
            transform: translateZ(10px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: transform 0.1s; /* Para el efecto tilt JS */
        }

        .lesson-header h1 { font-family: 'Outfit'; font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem; }
        
        .card-3d {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 16px; padding: 2rem;
            transition: all 0.4s; transform-style: preserve-3d;
        }
        .card-3d:hover { transform: translateY(-10px) rotateX(5deg); border-color: var(--primary); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .phrase-item {
            background: rgba(255,255,255,0.03); border-left: 3px solid var(--secondary);
            padding: 1rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;
            transition: 0.3s;
        }
        .phrase-item:hover { transform: translateX(10px); background: rgba(255,255,255,0.08); }

        .action-bar { margin-top: 3rem; display: flex; gap: 1rem; justify-content: flex-end; }
        .btn-action {
            padding: 1rem 2rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer;
            background: var(--bg-dark); color: white; border: 1px solid var(--border);
            transition: 0.3s; display: flex; align-items: center; gap: 0.5rem;
        }
        .btn-action.primary { background: var(--primary); border: none; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .btn-action:hover { transform: translateY(-3px); }

        /* --- MODALES 3D --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 100; display: none; justify-content: center; align-items: center;
            perspective: 1000px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #1e293b; border: 1px solid var(--border); padding: 3rem;
            border-radius: 24px; width: 90%; max-width: 800px;
            transform: rotateX(-10deg) scale(0.9); opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }
        .modal-overlay.active .modal-content { transform: rotateX(0) scale(1); opacity: 1; }

        /* Quiz Styles */
        .quiz-option {
            display: block; width: 100%; padding: 1.5rem; margin-bottom: 1rem;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 12px; color: white; text-align: left; cursor: pointer;
            transition: 0.2s;
        }
        .quiz-option:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .quiz-option.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); }
        .quiz-option.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error); animation: shake 0.4s; }

        /* Flashcard 3D */
        .flashcard-scene { perspective: 1000px; height: 300px; margin: 2rem 0; }
        .flashcard-inner {
            width: 100%; height: 100%; position: relative; transition: transform 0.8s;
            transform-style: preserve-3d; cursor: pointer;
        }
        .flashcard-inner.flipped { transform: rotateY(180deg); }
        .fc-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px; font-size: 2rem; font-weight: bold;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .fc-front { background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; }
        .fc-back { background: linear-gradient(135deg, var(--secondary), #db2777); color: white; transform: rotateY(180deg); }

        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
        
        /* Responsive */
        @media (max-width: 1024px) { .dashboard-container { grid-template-columns: 1fr; } .sidebar { display: none; } .hero-title { font-size: 3rem; } }
    </style>
</head>
<body>

    <div class="world-bg"></div>
    <div class="grid-floor"></div>

    <!-- LANDING -->
    <section id="landing-page">
        <h1 class="hero-title">English Master<br>3D Pro</h1>
        <p style="color: var(--text-muted); font-size: 1.2rem; margin-top: 1rem;">Experiencia de aprendizaje inmersiva</p>
        <button class="btn-3d" onclick="enterApp()">ENTRAR AL SISTEMA</button>
    </section>

    <!-- APP -->
    <section id="app-interface">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div style="margin-bottom: 2rem; font-weight: 800; font-size: 1.5rem;">
                    <i class="fas fa-cube" style="color: var(--primary);"></i> EMP.3D
                </div>
                <div id="module-list"></div>
                <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <div style="width:40px; height:40px; background:var(--primary); border-radius:50%;"></div>
                        <div><div style="font-weight:bold;">Usuario</div><div style="font-size:0.8rem; color:var(--success);">Nivel A1</div></div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-stage" id="main-stage">
                <div id="lesson-content"></div>
            </main>
        </div>
    </section>

    <!-- MODAL QUIZ -->
    <div id="quiz-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:2rem;">
                <h2 style="font-family:'Outfit'">EVALUACIÓN DE MÓDULO</h2>
                <button onclick="closeModal('quiz-modal')" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div id="quiz-area"></div>
            <button id="next-q-btn" class="btn-3d" style="width:100%; margin-top:2rem; opacity:0.5; pointer-events:none;" onclick="nextQuestion()">CONTINUAR</button>
        </div>
    </div>

    <!-- MODAL FLASHCARDS -->
    <div id="flash-modal" class="modal-overlay">
        <div class="modal-content" style="max-width:500px; text-align:center;">
            <h2 style="font-family:'Outfit'">FLASHCARDS 3D</h2>
            <div class="flashcard-scene">
                <div class="flashcard-inner" id="fc-inner" onclick="this.classList.toggle('flipped')">
                    <div class="fc-face fc-front"><div id="fc-front-text">Hello</div><div style="font-size:1rem; opacity:0.7; margin-top:1rem;">Click para voltear</div></div>
                    <div class="fc-face fc-back"><div id="fc-back-text">Hola</div></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; gap:1rem;">
                <button class="btn-action" onclick="prevCard()"><i class="fas fa-arrow-left"></i></button>
                <button class="btn-action" onclick="nextCard()"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn-action" style="margin-top:2rem; width:100%;" onclick="closeModal('flash-modal')">CERRAR</button>
        </div>
    </div>

    <!-- MODAL CHATBOT -->
    <div id="chat-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <h2>TUTOR IA</h2>
                <button onclick="closeModal('chat-modal')" style="background:none; border:none; color:white; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-history" style="height:300px; overflow-y:auto; background:rgba(0,0,0,0.3); padding:1rem; border-radius:12px; margin-bottom:1rem;"></div>
            <div style="display:flex; gap:1rem;">
                <input type="text" id="chat-input" placeholder="Escribe en inglés..." style="flex:1; padding:1rem; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:white;">
                <button class="btn-3d" style="margin:0; padding:1rem;" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS COMPLETA ---
        const lessonsDB = [
            {
                id: 1, title: "Saludos & Intro", icon: "fa-hand-sparkles", locked: false,
                desc: "Aprende a presentarte como un nativo.",
                phrases: [
                    { en: "Hello! My name is Ana.", es: "¡Hola! Me llamo Ana.", pron: "/həˈloʊ/" },
                    { en: "How are you? I am fine.", es: "¿Cómo estás? Estoy bien.", pron: "/haʊ ɑːr juː/" },
                    { en: "Nice to meet you.", es: "Mucho gusto.", pron: "/naɪs tuː miːt/" }
                ],
                quiz: [
                    { q: "¿Cómo saludas por la mañana?", opts: ["Good night", "Good morning", "Bye"], ans: 1 },
                    { q: "Completa: My name ___ John.", opts: ["is", "are", "am"], ans: 0 },
                    { q: "Traduce: Nice to meet you", opts: ["Adiós", "Mucho gusto", "Bienvenido"], ans: 1 }
                ]
            },
            {
                id: 2, title: "Familia & Posesivos", icon: "fa-users", locked: true,
                desc: "Habla sobre tu gente y pertenencias.",
                phrases: [
                    { en: "This is my brother.", es: "Este es mi hermano.", pron: "/ðɪs ɪz maɪ/" },
                    { en: "Her name is Sarah.", es: "Su nombre es Sarah.", pron: "/hɜːr neɪm/" },
                    { en: "They are my parents.", es: "Ellos son mis padres.", pron: "/ðeɪ ɑːr/" }
                ],
                quiz: [
                    { q: "Posesivo de She:", opts: ["His", "Her", "Hers"], ans: 1 },
                    { q: "Traduce: Parents", opts: ["Padres", "Parientes", "Personas"], ans: 0 },
                    { q: "Completa: This is ___ car.", opts: ["my", "I", "me"], ans: 0 }
                ]
            },
            {
                id: 3, title: "Rutinas Diarias", icon: "fa-clock", locked: true,
                desc: "Describe tu día a día con precisión.",
                phrases: [
                    { en: "I wake up at 7 AM.", es: "Me despierto a las 7.", pron: "/weɪk ʌp/" },
                    { en: "She works every day.", es: "Ella trabaja diario.", pron: "/wɜːrks/" },
                    { en: "What time do you eat?", es: "¿A qué hora comes?", pron: "/wʌt taɪm/" }
                ],
                quiz: [
                    { q: "Verbo para despertar:", opts: ["Sleep", "Wake up", "Eat"], ans: 1 },
                    { q: "Completa: She ___ every day.", opts: ["work", "works", "working"], ans: 1 },
                    { q: "Traduce: What time?", opts: ["Qué hora", "Qué día", "Dónde"], ans: 0 }
                ]
            }
        ];

        let currentLessonIdx = 0;
        let currentQIdx = 0;
        let score = 0;
        let userAnswered = false;
        let fcIdx = 0;

        // --- INICIALIZACIÓN ---
        function enterApp() {
            document.getElementById('landing-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                const app = document.getElementById('app-interface');
                app.style.display = 'block';
                setTimeout(() => app.style.opacity = '1', 50);
                loadProgress();
                renderSidebar();
                loadLesson(0);
            }, 800);
        }

        function loadProgress() {
            const saved = localStorage.getItem('emp3d_progress');
            if (saved) {
                const unlocked = JSON.parse(saved);
                lessonsDB.forEach(l => { if(unlocked.includes(l.id)) l.locked = false; });
            }
        }

        function saveProgress() {
            const unlocked = lessonsDB.filter(l => !l.locked).map(l => l.id);
            localStorage.setItem('emp3d_progress', JSON.stringify(unlocked));
        }

        // --- RENDERIZADO ---
        function renderSidebar() {
            const list = document.getElementById('module-list');
            list.innerHTML = lessonsDB.map((l, i) => `
                <div class="nav-item ${l.locked ? 'locked' : ''} ${i === currentLessonIdx ? 'active' : ''}" 
                     onclick="${l.locked ? '' : `loadLesson(${i})`}">
                    <i class="fas ${l.locked ? 'fa-lock' : l.icon}"></i>
                    <div>
                        <div style="font-weight:600">${l.title}</div>
                        <div style="font-size:0.7rem; opacity:0.7">Módulo 0${l.id}</div>
                    </div>
                </div>
            `).join('');
        }

        function loadLesson(idx) {
            currentLessonIdx = idx;
            renderSidebar();
            const l = lessonsDB[idx];
            const content = document.getElementById('lesson-content');
            
            // Animación de entrada
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                content.innerHTML = `
                    <div class="lesson-header">
                        <span style="color:var(--primary); font-weight:800; letter-spacing:2px;">MÓDULO 0${l.id}</span>
                        <h1>${l.title}</h1>
                        <p style="color:var(--text-muted); font-size:1.2rem;">${l.desc}</p>
                    </div>

                    <div class="content-grid">
                        <div class="card-3d">
                            <h3><i class="fas fa-comments" style="color:var(--secondary)"></i> Frases Clave</h3>
                            <div style="margin-top:1rem;">
                                ${l.phrases.map(p => `
                                    <div class="phrase-item">
                                        <div style="font-weight:bold; color:white;">${p.en}</div>
                                        <div style="color:var(--text-muted); font-size:0.9rem;">${p.es}</div>
                                        <div style="color:var(--primary); font-size:0.8rem; font-family:monospace;">${p.pron}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="card-3d">
                            <h3><i class="fas fa-book" style="color:var(--primary)"></i> Gramática Rápida</h3>
                            <p style="margin-top:1rem; color:var(--text-muted); line-height:1.6;">
                                En este módulo nos enfocamos en estructuras esenciales. 
                                Observa cómo cambian los verbos según la persona (I vs She/He).
                                Practica la pronunciación usando los botones de audio.
                            </p>
                            <button class="btn-action" style="margin-top:1rem;" onclick="playAudio('grammar')"><i class="fas fa-volume-up"></i> Escuchar Explicación</button>
                        </div>
                    </div>

                    <div class="action-bar">
                        <button class="btn-action" onclick="openFlashcards()"><i class="fas fa-clone"></i> Flashcards</button>
                        <button class="btn-action" onclick="openChat()"><i class="fas fa-robot"></i> Tutor IA</button>
                        <button class="btn-action primary" onclick="startQuiz()"><i class="fas fa-play"></i> INICIAR QUIZ</button>
                    </div>
                `;
                content.style.transition = 'all 0.5s ease';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 200);
        }

        // --- EFECTO TILT 3D EN MAIN STAGE ---
        const stage = document.getElementById('main-stage');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 1024) {
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            }
        });

        // --- QUIZ ENGINE ---
        function startQuiz() {
            currentQIdx = 0; score = 0;
            document.getElementById('quiz-modal').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const q = lessonsDB[currentLessonIdx].quiz[currentQIdx];
            const area = document.getElementById('quiz-area');
            const btn = document.getElementById('next-q-btn');
            
            userAnswered = false;
            btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
            
            area.innerHTML = `
                <h3 style="margin-bottom:1.5rem; font-size:1.5rem;">${q.q}</h3>
                <div style="display:grid; gap:1rem;">
                    ${q.opts.map((opt, i) => `
                        <button class="quiz-option" onclick="checkAnswer(this, ${i}, ${q.ans})">${opt}</button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            if(userAnswered) return;
            userAnswered = true;
            
            if(selected === correct) {
                btn.classList.add('correct');
                score++;
                playSound('success');
            } else {
                btn.classList.add('wrong');
                playSound('error');
            }
            
            const nextBtn = document.getElementById('next-q-btn');
            nextBtn.style.opacity = '1'; nextBtn.style.pointerEvents = 'all';
        }

        function nextQuestion() {
            currentQIdx++;
            if(currentQIdx < lessonsDB[currentLessonIdx].quiz.length) {
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const passed = score >= 2; // Aprobar con 2/3
            const area = document.getElementById('quiz-area');
            
            if(passed && currentLessonIdx < lessonsDB.length - 1) {
                lessonsDB[currentLessonIdx + 1].locked = false;
                saveProgress();
                renderSidebar();
            }

            area.innerHTML = `
                <div style="text-align:center;">
                    <i class="fas ${passed ? 'fa-trophy' : 'fa-times-circle'}" style="font-size:4rem; color:${passed ? 'gold' : 'var(--error)'}; margin-bottom:1rem;"></i>
                    <h2>${passed ? '¡MÓDULO COMPLETADO!' : 'INTENTA DE NUEVO'}</h2>
                    <p>Puntuación: ${score}/${lessonsDB[currentLessonIdx].quiz.length}</p>
                    ${passed && currentLessonIdx < lessonsDB.length - 1 ? '<p style="color:var(--success); margin-top:1rem;">>> SIGUIENTE MÓDULO DESBLOQUEADO</p>' : ''}
                </div>
            `;
            document.getElementById('next-q-btn').innerText = "FINALIZAR";
            document.getElementById('next-q-btn').onclick = () => closeModal('quiz-modal');
        }

        // --- FLASHCARDS & CHAT ---
        function openFlashcards() {
            fcIdx = 0;
            updateCard();
            document.getElementById('flash-modal').classList.add('active');
        }
        function updateCard() {
            const data = lessonsDB[currentLessonIdx].phrases[fcIdx];
            document.getElementById('fc-front-text').innerText = data.en;
            document.getElementById('fc-back-text').innerText = data.es;
            document.getElementById('fc-inner').classList.remove('flipped');
        }
        function nextCard() { fcIdx = (fcIdx + 1) % lessonsDB[currentLessonIdx].phrases.length; updateCard(); }
        function prevCard() { fcIdx = (fcIdx - 1 + lessonsDB[currentLessonIdx].phrases.length) % lessonsDB[currentLessonIdx].phrases.length; updateCard(); }

        function openChat() {
            document.getElementById('chat-modal').classList.add('active');
            const hist = document.getElementById('chat-history');
            if(hist.children.length === 0) {
                hist.innerHTML = `<div style="margin-bottom:1rem;"><strong style="color:var(--primary)">IA:</strong> Hello! I am ready to practice.</div>`;
            }
        }
        function sendChat() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;
            
            const hist = document.getElementById('chat-history');
            hist.innerHTML += `<div style="margin-bottom:1rem; text-align:right;"><strong style="color:var(--secondary)">Tú:</strong> ${txt}</div>`;
            input.value = '';
            
            setTimeout(() => {
                hist.innerHTML += `<div style="margin-bottom:1rem;"><strong style="color:var(--primary)">IA:</strong> That's interesting! Tell me more.</div>`;
                hist.scrollTop = hist.scrollHeight;
            }, 1000);
        }

        // --- UTILS ---
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function playAudio(type) { alert("🔊 Reproduciendo audio..."); }
        function playSound(type) {
            // Simple synth beep
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if(type === 'success') { osc.frequency.value = 600; type = 'sine'; } else { osc.frequency.value = 200; type = 'sawtooth'; }
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
            osc.start(); osc.stop(ctx.currentTime + 0.5);
        }
    </script>
</body>
</html>
