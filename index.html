<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishMaster Pro | Ultimate Learning Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.6);
            --secondary: #ec4899;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* --- BACKGROUND FX --- */
        .ambient-light {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatLight 10s infinite alternate ease-in-out;
        }
        .light-1 { top: -100px; left: -100px; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%); }
        .light-2 { bottom: -100px; right: -100px; }

        @keyframes floatLight {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* --- LANDING PAGE --- */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 3rem;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .cta-btn {
            padding: 1.2rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px var(--primary-glow);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .cta-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px var(--primary-glow);
        }

        .cta-btn:hover::before { left: 100%; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- APP INTERFACE --- */
        #app-interface {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            height: calc(100vh - 4rem);
        }

        /* Sidebar Glass */
        .sidebar {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transform: translateZ(20px);
        }

        .nav-item {
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.05);
            color: white;
            border-color: var(--primary);
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        /* Main Content Area */
        .main-stage {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            overflow-y: auto;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
        }

        .lesson-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content-block {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }
        
        .content-block:hover { transform: translateY(-5px); border-color: var(--primary); }

        /* --- ADVANCED QUIZ UI --- */
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .question-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .q-type-badge {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--accent);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .q-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 2rem; }

        /* Option Styles */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        .opt-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .opt-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .opt-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
        .opt-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: var(--error); animation: shake 0.4s; }

        /* Fill in Blanks Style */
        .sentence-builder {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .blank-slot {
            min-width: 100px;
            height: 40px;
            border-bottom: 2px solid var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-weight: bold;
        }
        .word-bank { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .word-chip {
            background: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .word-chip:hover { transform: scale(1.1); }
        .word-chip.used { opacity: 0.3; pointer-events: none; }

        /* Progress Bar */
        .progress-track {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 24px;
            max-width: 500px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px var(--primary-glow);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .sidebar { display: none; } /* Simplified for mobile demo */
            .hero-title { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- LANDING PAGE -->
    <section id="landing-page">
        <h1 class="hero-title">DOMINA EL INGLÉS<br>CON TECNOLOGÍA 3D</h1>
        <p class="hero-subtitle">Una experiencia de aprendizaje inmersiva. Quizzes interactivos, IA conversacional y progreso visual en tiempo real.</p>
        <button class="cta-btn" onclick="enterApp()">COMENZAR AHORA <i class="fas fa-arrow-right"></i></button>
    </section>

    <!-- MAIN APP -->
    <section id="app-interface">
        <div class="dashboard-grid">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div style="margin-bottom: 2rem; font-weight: 900; font-size: 1.5rem; color: white;">
                    <i class="fas fa-cube" style="color: var(--primary);"></i> EnglishPro
                </div>
                <div id="module-list"></div>
                
                <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="width: 40px; height: 40px; background: var(--secondary); border-radius: 50%;"></div>
                        <div>
                            <div style="font-weight: bold;">Estudiante</div>
                            <div style="font-size: 0.8rem; color: var(--success);">Nivel A1 • Activo</div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Stage -->
            <main class="main-stage">
                <div id="lesson-content">
                    <!-- Dynamic Content Injected Here -->
                </div>
            </main>
        </div>
    </section>

    <!-- QUIZ MODAL -->
    <div id="quiz-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 800px; width: 90%;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <span style="color: var(--text-muted);">Pregunta <span id="q-current">1</span>/<span id="q-total">5</span></span>
                <span style="color: var(--accent); font-weight: bold;">XP +100</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="quiz-progress"></div></div>
            
            <div id="quiz-area">
                <!-- Question types injected here -->
            </div>

            <button id="next-q-btn" class="cta-btn" style="margin-top: 2rem; width: 100%; opacity: 0.5; pointer-events: none;" onclick="nextQuestion()">SIGUIENTE</button>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE ---
        const lessons = [
            {
                id: 1, title: "Saludos & Intro", icon: "fa-hand-sparkles",
                desc: "Aprende a presentarte como un nativo.",
                quiz: [
                    { type: "choice", q: "¿Cómo saludas formalmente por la mañana?", opts: ["Hi there", "Good morning", "Hey buddy", "What's up"], ans: 1 },
                    { type: "fill", q: "Hello, my _____ is John.", words: ["name", "age", "from", "is"], ans: "name" },
                    { type: "choice", q: "Traduce: 'Mucho gusto'", opts: ["See you later", "Nice to meet you", "How are you", "Good night"], ans: 1 },
                    { type: "fill", q: "I _____ from Spain.", words: ["are", "am", "is", "be"], ans: "am" },
                    { type: "choice", q: "¿Qué significa 'See you later'?", opts: ["Te veo ahora", "Hasta luego", "Buenos días", "Adiós para siempre"], ans: 1 }
                ]
            },
            {
                id: 2, title: "Familia & Posesivos", icon: "fa-users",
                desc: "Habla sobre tu gente y pertenencias.",
                quiz: [
                    { type: "choice", q: "El posesivo de 'She' es:", opts: ["Her", "His", "Hers", "She's"], ans: 0 },
                    { type: "fill", q: "This is _____ brother.", words: ["my", "me", "I", "mine"], ans: "my" },
                    { type: "choice", q: "¿Quién es 'Mother'?", opts: ["Padre", "Hermana", "Madre", "Tía"], ans: 2 },
                    { type: "fill", q: "They are _____ parents.", words: ["our", "we", "us", "ours"], ans: "our" },
                    { type: "choice", q: "Completa: 'Is this _____ car?'", opts: ["you", "your", "yours", "my"], ans: 1 }
                ]
            },
            {
                id: 3, title: "Rutinas Diarias", icon: "fa-clock",
                desc: "Describe tu día a día con precisión.",
                quiz: [
                    { type: "choice", q: "I _____ up at 7 AM.", opts: ["wake", "wakes", "waking", "woke"], ans: 0 },
                    { type: "fill", q: "She _____ breakfast at 8.", words: ["eat", "eats", "eating", "ate"], ans: "eats" },
                    { type: "choice", q: "¿Qué significa 'Brush teeth'?", opts: ["Peinarse", "Lavarse las manos", "Cepillarse los dientes", "Bañarse"], ans: 2 },
                    { type: "fill", q: "We _____ to work by bus.", words: ["go", "goes", "going", "gone"], ans: "go" },
                    { type: "choice", q: "Elige la correcta:", opts: ["He sleep late", "He sleeps late", "He sleeping late", "He sleepes late"], ans: 1 }
                ]
            }
        ];

        let currentLesson = 0;
        let currentQIndex = 0;
        let score = 0;
        let userAnswer = null;

        // --- CORE FUNCTIONS ---
        function enterApp() {
            document.getElementById('landing-page').style.opacity = '0';
            document.getElementById('landing-page').style.transform = 'scale(1.1)';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                const app = document.getElementById('app-interface');
                app.style.display = 'block';
                // Trigger reflow
                void app.offsetWidth; 
                app.style.opacity = '1';
                renderSidebar();
                loadLesson(0);
            }, 800);
        }

        function renderSidebar() {
            const list = document.getElementById('module-list');
            list.innerHTML = lessons.map((l, i) => `
                <div class="nav-item ${i === currentLesson ? 'active' : ''}" onclick="loadLesson(${i})">
                    <div class="nav-icon"><i class="fas ${l.icon}"></i></div>
                    <div>
                        <div style="font-weight:600">${l.title}</div>
                        <div style="font-size:0.8rem; opacity:0.7">Unidad 0${l.id}</div>
                    </div>
                </div>
            `).join('');
        }

        function loadLesson(index) {
            currentLesson = index;
            renderSidebar();
            const l = lessons[index];
            const content = document.getElementById('lesson-content');
            
            // Animation reset
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                content.innerHTML = `
                    <div class="lesson-header">
                        <div style="color:var(--accent); font-weight:bold; margin-bottom:10px;">MÓDULO 0${l.id} COMPLETADO AL 85%</div>
                        <h1>${l.title}</h1>
                        <p style="color:var(--text-muted); font-size:1.2rem;">${l.desc}</p>
                    </div>

                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:2rem; margin-top:3rem;">
                        <div class="content-block">
                            <h3><i class="fas fa-book-open" style="color:var(--secondary)"></i> Vocabulario Clave</h3>
                            <ul style="margin-top:1rem; list-style:none; line-height:2;">
                                <li>🔹 <strong>Wake up</strong> - Despertarse</li>
                                <li>🔹 <strong>Have breakfast</strong> - Desayunar</li>
                                <li>🔹 <strong>Go to work</strong> - Ir a trabajar</li>
                            </ul>
                        </div>
                        <div class="content-block">
                            <h3><i class="fas fa-brain" style="color:var(--accent)"></i> Gramática Rápida</h3>
                            <p style="margin-top:1rem; color:var(--text-muted);">Recuerda usar el <strong>Present Simple</strong> para rutinas. No olvides la 's' en tercera persona (He/She/It).</p>
                        </div>
                    </div>

                    <div style="margin-top:3rem; text-align:center;">
                        <button class="cta-btn" onclick="startQuiz()">
                            <i class="fas fa-play"></i> INICIAR QUIZ AVANZADO
                        </button>
                    </div>
                `;
                content.style.transition = 'all 0.5s ease';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 200);
        }

        // --- ADVANCED QUIZ ENGINE ---
        function startQuiz() {
            currentQIndex = 0;
            score = 0;
            document.getElementById('quiz-modal').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const qData = lessons[currentLesson].quiz[currentQIndex];
            const area = document.getElementById('quiz-area');
            const nextBtn = document.getElementById('next-q-btn');
            
            // Reset UI
            nextBtn.style.opacity = '0.5';
            nextBtn.style.pointerEvents = 'none';
            userAnswer = null;
            
            // Update Progress
            document.getElementById('q-current').innerText = currentQIndex + 1;
            document.getElementById('q-total').innerText = lessons[currentLesson].quiz.length;
            document.getElementById('quiz-progress').style.width = `${((currentQIndex) / lessons[currentLesson].quiz.length) * 100}%`;

            let html = `<div class="q-type-badge">${qData.type === 'choice' ? 'SELECCIÓN' : 'COMPLETAR'}</div>`;
            html += `<div class="q-text">${qData.q}</div>`;

            if (qData.type === 'choice') {
                html += `<div class="options-grid">
                    ${qData.opts.map((opt, i) => `
                        <button class="opt-btn" onclick="handleChoice(this, ${i}, ${qData.ans})">${opt}</button>
                    `).join('')}
                </div>`;
            } else if (qData.type === 'fill') {
                // Create sentence with blank
                const parts = qData.q.split('_____');
                html += `<div class="sentence-builder">
                    <span>${parts[0]}</span>
                    <div class="blank-slot" id="target-slot">?</div>
                    <span>${parts[1] || ''}</span>
                </div>
                <div class="word-bank">
                    ${qData.words.map(w => `<div class="word-chip" onclick="handleFill(this, '${w}', '${qData.ans}')">${w}</div>`).join('')}
                </div>`;
            }

            area.innerHTML = html;
        }

        function handleChoice(btn, selected, correct) {
            if(userAnswer) return; // Prevent multiple clicks
            userAnswer = true;
            
            const btns = document.querySelectorAll('.opt-btn');
            if(selected === correct) {
                btn.classList.add('correct');
                score++;
                playSound('success');
            } else {
                btn.classList.add('wrong');
                btns[correct].classList.add('correct'); // Show correct one
                playSound('error');
            }
            enableNext();
        }

        function handleFill(chip, word, correct) {
            if(userAnswer) return;
            userAnswer = true;
            
            const slot = document.getElementById('target-slot');
            slot.innerText = word;
            
            if(word === correct) {
                slot.style.color = 'var(--success)';
                slot.style.borderBottomColor = 'var(--success)';
                score++;
                playSound('success');
            } else {
                slot.style.color = 'var(--error)';
                slot.style.borderBottomColor = 'var(--error)';
                playSound('error');
            }
            
            // Disable all chips
            document.querySelectorAll('.word-chip').forEach(c => c.classList.add('used'));
            enableNext();
        }

        function enableNext() {
            const btn = document.getElementById('next-q-btn');
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'all';
        }

        function nextQuestion() {
            currentQIndex++;
            if(currentQIndex < lessons[currentLesson].quiz.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const area = document.getElementById('quiz-area');
            const percentage = (score / lessons[currentLesson].quiz.length) * 100;
            let msg = percentage === 100 ? "¡PERFECTO!" : percentage >= 60 ? "¡BIEN HECHO!" : "SIGUE PRACTICANDO";
            let color = percentage === 100 ? "var(--success)" : "white";

            document.getElementById('quiz-progress').style.width = '100%';
            
            area.innerHTML = `
                <div style="text-align:center; padding: 2rem;">
                    <i class="fas fa-trophy" style="font-size: 5rem; color: gold; margin-bottom: 1rem; animation: bounce 1s infinite;"></i>
                    <h2 style="font-size: 2.5rem; color: ${color}; margin-bottom: 1rem;">${msg}</h2>
                    <p style="font-size: 1.5rem; color: var(--text-muted);">Puntuación: ${score}/${lessons[currentLesson].quiz.length}</p>
                    <button class="cta-btn" style="margin-top: 2rem;" onclick="document.getElementById('quiz-modal').classList.remove('active')">VOLVER AL CURSO</button>
                </div>
            `;
            document.getElementById('next-q-btn').style.display = 'none';
        }

        // Simple Audio Synth for Feedback (No external files needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if(type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Close modal on outside click
        document.getElementById('quiz-modal').addEventListener('click', (e) => {
            if(e.target.id === 'quiz-modal') document.getElementById('quiz-modal').classList.remove('active');
        });

    </script>
</body>
