<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishMaster Pro | Red Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* PALETA ROJO Y NEGRO PREMIUM */
            --primary: #dc2626; /* Rojo Intenso */
            --primary-dark: #991b1b;
            --primary-glow: rgba(220, 38, 38, 0.5);
            --secondary: #fca5a5; /* Rojo pálido para acentos */
            --bg-dark: #050505; /* Negro casi puro */
            --bg-panel: #121212; /* Gris muy oscuro */
            --bg-card: rgba(20, 20, 20, 0.8);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --success: #22c55e;
            --error: #ef4444;
            --locked: #3f3f46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* --- FONDO ANIMADO ROJO --- */
        .ambient-light {
            position: fixed; width: 800px; height: 800px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: -1; filter: blur(100px); opacity: 0.2;
            animation: pulseRed 8s infinite alternate ease-in-out;
        }
        .light-1 { top: -200px; left: -200px; }
        .light-2 { bottom: -200px; right: -200px; animation-delay: 4s; }

        @keyframes pulseRed {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.4; }
        }

        /* --- LANDING PAGE --- */
        #landing-page {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; position: relative; z-index: 10; transition: opacity 0.8s ease;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif; font-size: 6rem; font-weight: 900; line-height: 1;
            background: linear-gradient(180deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: -2px;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(50px);
        }

        .hero-subtitle {
            font-size: 1.2rem; color: var(--text-muted); max-width: 500px; margin-bottom: 3rem; letter-spacing: 1px;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards; opacity: 0;
        }

        .cta-btn {
            padding: 1rem 2.5rem; font-size: 1rem; font-weight: 800; color: white; text-transform: uppercase; letter-spacing: 2px;
            background: var(--primary); border: none; clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards; opacity: 0;
        }

        .cta-btn:hover {
            background: white; color: var(--primary);
            box-shadow: 0 0 50px var(--primary-glow);
            transform: translateY(-2px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* --- APP INTERFACE --- */
        #app-interface { display: none; opacity: 0; transition: opacity 1s ease; padding: 2rem; max-width: 1600px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; height: calc(100vh - 4rem); }

        /* Sidebar Premium */
        .sidebar {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 0; /* Bordes rectos para look tech */
            padding: 2rem; display: flex; flex-direction: column; position: relative;
        }
        .sidebar::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        .nav-item {
            padding: 1.2rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 1rem; color: var(--text-muted);
            border-left: 2px solid transparent; background: linear-gradient(90deg, transparent, transparent);
        }

        .nav-item:hover { color: white; background: linear-gradient(90deg, rgba(220, 38, 38, 0.1), transparent); border-left-color: var(--primary); padding-left: 1.5rem; }
        .nav-item.active { 
            color: white; background: linear-gradient(90deg, rgba(220, 38, 38, 0.2), transparent); 
            border-left-color: var(--primary); font-weight: 700;
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .nav-item.locked { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        .nav-icon {
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.2rem;
        }

        /* Main Stage */
        .main-stage {
            background: var(--bg-panel); border: 1px solid var(--border); padding: 3rem;
            position: relative; overflow-y: auto;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }
        /* Efecto de esquina roja */
        .main-stage::after {
            content: ''; position: absolute; top: 0; right: 0; width: 0; height: 0;
            border-style: solid; border-width: 0 50px 50px 0; border-color: transparent var(--primary) transparent transparent;
        }

        .lesson-header h1 {
            font-family: 'Outfit', sans-serif; font-size: 3.5rem; text-transform: uppercase;
            color: white; margin-bottom: 0.5rem; letter-spacing: -1px;
        }
        .lesson-header span { color: var(--primary); font-weight: 800; letter-spacing: 2px; font-size: 0.9rem; }

        .content-block {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 2rem; margin-top: 2rem;
            transition: all 0.3s; position: relative;
        }
        .content-block:hover { border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(5px); }
        .content-block h3 { color: var(--primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }

        /* Phrase Cards Red Style */
        .phrase-list { display: grid; gap: 1rem; margin-top: 1rem; }
        .phrase-card {
            background: #000; border-left: 3px solid var(--primary); padding: 1.5rem;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .phrase-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, var(--primary-glow), transparent); opacity: 0; transition: 0.3s;
        }
        .phrase-card:hover { transform: scale(1.02); border-left-width: 6px; }
        .phrase-card:hover::before { opacity: 0.1; }
        .phrase-en { font-size: 1.3rem; font-weight: 700; color: white; margin-bottom: 0.5rem; position: relative; z-index: 1; }
        .phrase-es { color: var(--text-muted); position: relative; z-index: 1; }
        .phrase-pron { color: var(--primary); font-size: 0.8rem; font-family: monospace; margin-top: 0.5rem; position: relative; z-index: 1; }

        /* --- QUIZ UI RED --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-panel); border: 1px solid var(--primary); padding: 3rem;
            max-width: 800px; width: 90%; position: relative;
            box-shadow: 0 0 100px rgba(220, 38, 38, 0.2);
        }
        .modal-content::before {
            content: 'SYSTEM QUIZ'; position: absolute; top: -10px; left: 20px;
            background: var(--primary); color: black; padding: 2px 10px; font-weight: 800; font-size: 0.8rem;
        }

        .q-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 2rem; color: white; }
        
        .opt-btn {
            background: transparent; border: 1px solid var(--border); padding: 1.5rem;
            color: var(--text-muted); font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
            text-align: left; position: relative;
        }
        .opt-btn:hover { border-color: var(--primary); color: white; background: rgba(220, 38, 38, 0.05); }
        .opt-btn.correct { border-color: var(--success); color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .opt-btn.wrong { border-color: var(--error); color: var(--error); background: rgba(239, 68, 68, 0.1); }

        .progress-track { height: 4px; background: #333; margin-bottom: 2rem; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; box-shadow: 0 0 10px var(--primary); }

        /* Word Bank for Fill-in */
        .word-chip {
            background: var(--bg-dark); border: 1px solid var(--primary); color: var(--primary);
            padding: 8px 16px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .word-chip:hover { background: var(--primary); color: white; box-shadow: 0 0 15px var(--primary-glow); }

        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } .sidebar { display: none; } .hero-title { font-size: 3rem; } }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- LANDING PAGE -->
    <section id="landing-page">
        <h1 class="hero-title">MASTER<br>ENGLISH</h1>
        <p class="hero-subtitle">PLATAFORMA DE ENTRENAMIENTO LINGÜÍSTICO DE ÉLITE</p>
        <button class="cta-btn" onclick="enterApp()">INICIAR SISTEMA</button>
    </section>

    <!-- MAIN APP -->
    <section id="app-interface">
        <div class="dashboard-grid">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div style="margin-bottom: 2rem; font-weight: 900; font-size: 1.5rem; color: white; letter-spacing: -1px;">
                    <i class="fas fa-cube" style="color: var(--primary);"></i> EMP<span style="color:var(--primary)">.PRO</span>
                </div>
                <div id="module-list"></div>
                
                <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="width: 40px; height: 40px; background: var(--bg-dark); border: 1px solid var(--primary); border-radius: 50%; display:flex; align-items:center; justify-content:center; color:var(--primary);"><i class="fas fa-user"></i></div>
                        <div>
                            <div style="font-weight: bold; color:white;">OPERADOR</div>
                            <div style="font-size: 0.8rem; color: var(--success);">NIVEL A1 • ACTIVO</div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Stage -->
            <main class="main-stage">
                <div id="lesson-content"></div>
            </main>
        </div>
    </section>

    <!-- QUIZ MODAL -->
    <div id="quiz-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                <span>SECUENCIA <span id="q-current">1</span>/<span id="q-total">5</span></span>
                <span style="color: var(--primary);">XP +100</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="quiz-progress"></div></div>
            
            <div id="quiz-area"></div>

            <button id="next-q-btn" class="cta-btn" style="margin-top: 2rem; width: 100%; opacity: 0.5; pointer-events: none;" onclick="nextQuestion()">SIGUIENTE FASE</button>
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE ---
        const lessons = [
            {
                id: 1, title: "Saludos & Intro", icon: "fa-hand-sparkles", locked: false,
                desc: "Protocolos básicos de interacción.",
                phrases: [
                    { en: "Hello! My name is Ana.", es: "¡Hola! Me llamo Ana.", pron: "/həˈloʊ maɪ neɪm ɪz ˈænə/" },
                    { en: "How are you? I am fine.", es: "¿Cómo estás? Estoy bien.", pron: "/haʊ ɑːr juː aɪ æm faɪn/" },
                    { en: "Nice to meet you.", es: "Mucho gusto.", pron: "/naɪs tuː miːt juː/" }
                ],
                quiz: [
                    { type: "choice", q: "¿Saludo formal matutino?", opts: ["Hi there", "Good morning", "Hey", "What's up"], ans: 1 },
                    { type: "fill", q: "Hello, my _____ is John.", words: ["name", "age", "from"], ans: "name" },
                    { type: "choice", q: "Traduce: 'Mucho gusto'", opts: ["See you", "Nice to meet you", "How are you"], ans: 1 },
                    { type: "fill", q: "I _____ from Spain.", words: ["are", "am", "is"], ans: "am" },
                    { type: "choice", q: "¿'See you later' significa?", opts: ["Te veo ahora", "Hasta luego", "Buenos días"], ans: 1 }
                ]
            },
            {
                id: 2, title: "Familia & Posesivos", icon: "fa-users", locked: true,
                desc: "Estructuras de pertenencia y linaje.",
                phrases: [
                    { en: "This is my brother.", es: "Este es mi hermano.", pron: "/ðɪs ɪz maɪ ˈbrʌðər/" },
                    { en: "Her name is Sarah.", es: "Su nombre es Sarah.", pron: "/hɜːr neɪm ɪz ˈsɛrə/" },
                    { en: "They are my parents.", es: "Ellos son mis padres.", pron: "/ðeɪ ɑːr maɪ ˈpɛrənts/" }
                ],
                quiz: [
                    { type: "choice", q: "Posesivo de 'She':", opts: ["Her", "His", "Hers"], ans: 0 },
                    { type: "fill", q: "This is _____ brother.", words: ["my", "me", "I"], ans: "my" },
                    { type: "choice", q: "¿'Mother' es?", opts: ["Padre", "Madre", "Tía"], ans: 1 },
                    { type: "fill", q: "They are _____ parents.", words: ["our", "we", "us"], ans: "our" },
                    { type: "choice", q: "Completa: 'Is this _____ car?'", opts: ["you", "your", "yours"], ans: 1 }
                ]
            },
            {
                id: 3, title: "Rutinas Diarias", icon: "fa-clock", locked: true,
                desc: "Cronología de acciones habituales.",
                phrases: [
                    { en: "I wake up at 7 AM.", es: "Me despierto a las 7 AM.", pron: "/aɪ weɪk ʌp æt ˈsɛvən/" },
                    { en: "She works every day.", es: "Ella trabaja todos los días.", pron: "/ʃiː wɜːrks ˈɛvri deɪ/" },
                    { en: "What time do you eat?", es: "¿A qué hora comes?", pron: "/wʌt taɪm duː juː iːt/" }
                ],
                quiz: [
                    { type: "choice", q: "I _____ up at 7 AM.", opts: ["wake", "wakes", "waking"], ans: 0 },
                    { type: "fill", q: "She _____ breakfast at 8.", words: ["eat", "eats", "eating"], ans: "eats" },
                    { type: "choice", q: "¿'Brush teeth' es?", opts: ["Peinarse", "Cepillarse dientes", "Bañarse"], ans: 1 },
                    { type: "fill", q: "We _____ to work by bus.", words: ["go", "goes", "going"], ans: "go" },
                    { type: "choice", q: "Elige la correcta:", opts: ["He sleep late", "He sleeps late", "He sleeping late"], ans: 1 }
                ]
            }
        ];

        let currentLesson = 0;
        let currentQIndex = 0;
        let score = 0;
        let userAnswer = null;

        // --- CORE FUNCTIONS ---
        function enterApp() {
            document.getElementById('landing-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                const app = document.getElementById('app-interface');
                app.style.display = 'block';
                void app.offsetWidth; 
                app.style.opacity = '1';
                loadProgress(); // Cargar progreso guardado
                renderSidebar();
                loadLesson(0);
            }, 800);
        }

        function loadProgress() {
            const saved = localStorage.getItem('emp_progress');
            if (saved) {
                const unlockedIds = JSON.parse(saved);
                lessons.forEach(l => {
                    if (unlockedIds.includes(l.id)) l.locked = false;
                });
            }
        }

        function saveProgress() {
            const unlockedIds = lessons.filter(l => !l.locked).map(l => l.id);
            localStorage.setItem('emp_progress', JSON.stringify(unlockedIds));
        }

        function renderSidebar() {
            const list = document.getElementById('module-list');
            list.innerHTML = lessons.map((l, i) => `
                <div class="nav-item ${l.locked ? 'locked' : ''} ${i === currentLesson ? 'active' : ''}" 
                     onclick="${l.locked ? '' : `loadLesson(${i})`}">
                    <div class="nav-icon"><i class="fas ${l.locked ? 'fa-lock' : l.icon}"></i></div>
                    <div>
                        <div style="font-weight:600">${l.title}</div>
                        <div style="font-size:0.7rem; opacity:0.7">MÓDULO 0${l.id}</div>
                    </div>
                </div>
            `).join('');
        }

        function loadLesson(index) {
            currentLesson = index;
            renderSidebar();
            const l = lessons[index];
            const content = document.getElementById('lesson-content');
            
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                const phrasesHTML = l.phrases.map(p => `
                    <div class="phrase-card">
                        <div class="phrase-en">${p.en}</div>
                        <div class="phrase-es">${p.es}</div>
                        <div class="phrase-pron">${p.pron}</div>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="lesson-header">
                        <span>MÓDULO 0${l.id} // ACCESO CONCEDIDO</span>
                        <h1>${l.title}</h1>
                        <p style="color:var(--text-muted); font-size:1.2rem; max-width:600px;">${l.desc}</p>
                    </div>

                    <div class="content-block">
                        <h3><i class="fas fa-database"></i> BASE DE DATOS DE FRASES</h3>
                        <div class="phrase-list">${phrasesHTML}</div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem; margin-top:2rem;">
                        <div class="content-block">
                            <h3><i class="fas fa-microchip"></i> VOCABULARIO</h3>
                            <ul style="margin-top:1rem; list-style:none; line-height:2; color:var(--text-muted);">
                                <li>> ${l.phrases[0].en.split(' ')[0]} <span style="color:white">[KEY_01]</span></li>
                                <li>> ${l.phrases[1].en.split(' ')[0]} <span style="color:white">[KEY_02]</span></li>
                                <li>> ${l.phrases[2].en.split(' ')[0]} <span style="color:white">[KEY_03]</span></li>
                            </ul>
                        </div>
                        <div class="content-block">
                            <h3><i class="fas fa-code"></i> LÓGICA GRAMATICAL</h3>
                            <p style="margin-top:1rem; color:var(--text-muted);">Análisis estructural de ${l.title.toLowerCase()}. Ejecutar protocolos de práctica para dominar la sintaxis.</p>
                        </div>
                    </div>

                    <div style="margin-top:3rem; text-align:center;">
                        <button class="cta-btn" onclick="startQuiz()">
                            <i class="fas fa-play"></i> INICIAR PRUEBA DE COMPETENCIA
                        </button>
                    </div>
                `;
                content.style.transition = 'all 0.5s ease';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 200);
        }

        // --- QUIZ ENGINE ---
        function startQuiz() {
            currentQIndex = 0; score = 0;
            document.getElementById('quiz-modal').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const qData = lessons[currentLesson].quiz[currentQIndex];
            const area = document.getElementById('quiz-area');
            const nextBtn = document.getElementById('next-q-btn');
            
            nextBtn.style.opacity = '0.5'; nextBtn.style.pointerEvents = 'none';
            userAnswer = null;
            
            document.getElementById('q-current').innerText = currentQIndex + 1;
            document.getElementById('q-total').innerText = lessons[currentLesson].quiz.length;
            document.getElementById('quiz-progress').style.width = `${((currentQIndex) / lessons[currentLesson].quiz.length) * 100}%`;

            let html = `<div class="q-text">${qData.q}</div>`;

            if (qData.type === 'choice') {
                html += `<div style="display:grid; gap:1rem;">
                    ${qData.opts.map((opt, i) => `<button class="opt-btn" onclick="handleChoice(this, ${i}, ${qData.ans})">${opt}</button>`).join('')}
                </div>`;
            } else if (qData.type === 'fill') {
                const parts = qData.q.split('_____');
                html += `<div style="font-size:1.5rem; margin-bottom:2rem; color:white;">
                    ${parts[0]} <span style="color:var(--primary); border-bottom:2px solid white; padding:0 10px;">?</span> ${parts[1] || ''}
                </div>
                <div style="display:flex; gap:10px; justify-content:center;">
                    ${qData.words.map(w => `<div class="word-chip" onclick="handleFill(this, '${w}', '${qData.ans}')">${w}</div>`).join('')}
                </div>`;
            }
            area.innerHTML = html;
        }

        function handleChoice(btn, selected, correct) {
            if(userAnswer) return; userAnswer = true;
            if(selected === correct) {
                btn.classList.add('correct'); score++; playSound('success');
            } else {
                btn.classList.add('wrong'); playSound('error');
            }
            enableNext();
        }

        function handleFill(chip, word, correct) {
            if(userAnswer) return; userAnswer = true;
            if(word === correct) {
                chip.style.background = 'var(--success)'; chip.style.color = 'white'; score++; playSound('success');
            } else {
                chip.style.background = 'var(--error)'; chip.style.color = 'white'; playSound('error');
            }
            enableNext();
        }

        function enableNext() {
            const btn = document.getElementById('next-q-btn');
            btn.style.opacity = '1'; btn.style.pointerEvents = 'all';
        }

        function nextQuestion() {
            currentQIndex++;
            if(currentQIndex < lessons[currentLesson].quiz.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const percentage = (score / lessons[currentLesson].quiz.length) * 100;
            const passed = percentage >= 60;
            const area = document.getElementById('quiz-area');
            
            // UNLOCK LOGIC
            if (passed && currentLesson < lessons.length - 1) {
                lessons[currentLesson + 1].locked = false;
                saveProgress();
                renderSidebar(); // Update sidebar visuals
            }

            area.innerHTML = `
                <div style="text-align:center; padding: 2rem;">
                    <i class="fas ${passed ? 'fa-check-circle' : 'fa-times-circle'}" style="font-size: 4rem; color: ${passed ? 'var(--success)' : 'var(--error)'}; margin-bottom: 1rem;"></i>
                    <h2 style="font-size: 2rem; color: white; margin-bottom: 1rem;">${passed ? 'OBJETIVO CUMPLIDO' : 'FALLO EN EL SISTEMA'}</h2>
                    <p style="color: var(--text-muted);">Precisión: ${percentage}%</p>
                    ${passed && currentLesson < lessons.length - 1 ? '<p style="color:var(--primary); margin-top:10px;">>> NUEVO MÓDULO DESBLOQUEADO</p>' : ''}
                    <button class="cta-btn" style="margin-top: 2rem;" onclick="document.getElementById('quiz-modal').classList.remove('active')">VOLVER AL PANEL</button>
                </div>
            `;
            document.getElementById('next-q-btn').style.display = 'none';
        }

        // Audio Synth
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            }
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        document.getElementById('quiz-modal').addEventListener('click', (e) => {
            if(e.target.id === 'quiz-modal') document.getElementById('quiz-modal').classList.remove('active');
        });
    </script>
</body>
</html>
